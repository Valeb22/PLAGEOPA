<!-- src/app/change-password/change-password.html -->
<main class="page">
  <section class="card" [class.card--loading]="loading()">
    <header class="card__header">
      <h1 class="title">Cambiar contraseña</h1>
      <p class="subtitle">
        Por seguridad, debes actualizar tu contraseña antes de continuar.
      </p>
    </header>

    @if (pageError()) {
      <div class="alert alert--error" role="alert" aria-live="polite">
        <strong>No se pudo actualizar la contraseña.</strong>
        <span>{{ pageError() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form" novalidate>
      <label class="field" [class.field--invalid]="isInvalid('currentPassword')">
        <span class="field__label">Contraseña actual</span>
        <input
          class="input"
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          aria-describedby="err-current"
        />
        @if (isInvalid('currentPassword')) {
          <small id="err-current" class="err">La contraseña actual es obligatoria.</small>
        }
      </label>

      <label class="field" [class.field--invalid]="isInvalid('newPassword')">
        <span class="field__label">Nueva contraseña</span>
        <input
          class="input"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          aria-describedby="err-new"
        />
        @if (isInvalid('newPassword')) {
          <small id="err-new" class="err">Debe tener mínimo 8 caracteres.</small>
        }
      </label>

      <label class="field" [class.field--invalid]="passwordMismatch() && submitted">
        <span class="field__label">Confirmar nueva contraseña</span>
        <input
          class="input"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          aria-describedby="err-confirm"
        />
        @if (submitted && form.controls['confirmPassword'].invalid) {
          <small id="err-confirm" class="err">La confirmación es obligatoria.</small>
        } @else if (passwordMismatch() && submitted) {
          <small id="err-confirm" class="err">La nueva contraseña y la confirmación no coinciden.</small>
        }
      </label>

      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        @if (!loading()) { <span>Actualizar</span> }
        @else { <span class="spinner" aria-hidden="true"></span> Procesando… }
      </button>

      <p class="hint">
        Recomendación: utiliza una contraseña de al menos 8 caracteres.
      </p>
    </form>
  </section>

  <!-- Toasts -->
  <div class="toast-stack" aria-live="polite" aria-atomic="true">
    @for (t of toasts(); track t.id) {
      <div class="toast" [class]="'toast toast--' + t.type">
        <div class="toast__body">
          <strong>{{ t.title }}</strong>
          <div class="toast__msg">{{ t.message }}</div>
        </div>
        <button type="button" class="toast__close" (click)="dismissToast(t.id)" aria-label="Cerrar">✕</button>
      </div>
    }
  </div>
</main>
